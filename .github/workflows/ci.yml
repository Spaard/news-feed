name: CI

on:
  push:
  pull_request:

jobs:
  # Lint, formatage, tests et validation de l'infra : le hook pre-push lance les trois premiers.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Build + smoke test de l'image à chaque push ; publication sur GHCR pour les pushs sur main.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: news-feed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e NEWS_FEED_REFRESH_MINUTES=0 news-feed:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "$GITHUB_SHA" latest; do
            docker tag news-feed:ci "$image:$tag"
            docker push "$image:$tag"
          done

  # Mise à jour de la Container App ; sauté tant que les variables Azure du repo ne sont pas définies.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
