# Catalogue des sources et taxonomie des tags.
#
# [[tags]] : taxonomie fixe. `description` guide le classifieur IA. Les tags `france` et
#            `international` servent aussi au filtre France / Monde.
# [[feeds]] : un flux RSS/Atom. `source` = nom du média (plusieurs rubriques d'un même média
#             comptent pour une seule source). `une` = flux « à la une » (signal d'importance),
#             `paywall` = articles souvent réservés aux abonnés, `focus` = source spécialisée
#             d'un sujet approfondi (chacun de ses articles compte, même seul sur son sujet).

# --- Taxonomie ---

[[tags]]
slug = "politique"
label_fr = "Politique"
label_en = "French politics"
description = "Politique française : gouvernement, Parlement, partis, élections et institutions en France."

[[tags]]
slug = "france"
label_fr = "France"
label_en = "France"
description = "Tag géographique, en plus des thèmes : l'actualité concerne d'abord la France, quel que soit le thème (politique, société, faits divers, économie, sport, culture…)."

[[tags]]
slug = "international"
label_fr = "International"
label_en = "World"
description = "Relations internationales, géopolitique, conflits, diplomatie et politique intérieure des autres pays."

[[tags]]
slug = "economie"
label_fr = "Économie"
label_en = "Economy"
description = "Économie, entreprises, marchés financiers, emploi, commerce, finances publiques."

[[tags]]
slug = "societe"
label_fr = "Société"
label_en = "Society"
description = "Société : éducation, logement, transports, religion, mouvements sociaux, vie quotidienne."

[[tags]]
slug = "justice"
label_fr = "Justice"
label_en = "Justice & crime"
description = "Justice, police, procès, criminalité et faits divers."

[[tags]]
slug = "sante"
label_fr = "Santé"
label_en = "Health"
description = "Santé, médecine, épidémies, système de soins."

[[tags]]
slug = "environnement"
label_fr = "Environnement"
label_en = "Environment"
description = "Environnement, climat, énergie, biodiversité, catastrophes naturelles."

[[tags]]
slug = "sciences"
label_fr = "Sciences"
label_en = "Science"
description = "Recherche scientifique, espace, découvertes (hors informatique)."

[[tags]]
slug = "tech"
label_fr = "Tech"
label_en = "Tech"
description = "Numérique et technologies : entreprises tech, produits, internet, télécoms, régulation du numérique."

[[tags]]
slug = "ia"
label_fr = "IA"
label_en = "AI"
description = "Intelligence artificielle : modèles, recherche, entreprises et régulation de l'IA."

[[tags]]
slug = "cyber"
label_fr = "Cyber"
label_en = "Cyber"
description = "Cybersécurité : attaques, failles, fuites de données, cybercriminalité, cyberdéfense."

[[tags]]
slug = "culture"
label_fr = "Culture"
label_en = "Culture"
description = "Culture, arts, cinéma, musique, livres, médias, célébrités."

[[tags]]
